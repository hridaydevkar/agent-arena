name: Verify workbench
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[dev]'
      - run: ruff check backend sdk tests scripts examples
      - run: pytest -q
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start disposable local server
        run: |
          ARENA_DATA_DIR="$RUNNER_TEMP/arena-ci" python -m uvicorn arena_server.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/arena-server.log" 2>&1 &
          ARENA_DATA_DIR="$RUNNER_TEMP/arena-public-ci" ARENA_READ_ONLY=1 OPENAI_API_KEY='' python -m uvicorn arena_server.main:app --host 127.0.0.1 --port 8003 > "$RUNNER_TEMP/arena-public.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          for _ in range(60):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
                  urllib.request.urlopen('http://127.0.0.1:8003/api/health', timeout=2)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Backend did not become ready')
          PY
      - run: npm run test:e2e
        working-directory: frontend
        env:
          ARENA_PUBLIC_TEST_URL: http://127.0.0.1:8003
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/
