[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-arena-local"
version = "0.2.0"
description = "A local-first agent benchmarking workbench with verifiable execution traces"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["fastapi==0.141.1", "uvicorn[standard]==0.53.0", "httpx==0.28.1", "pydantic==2.13.4", "starlette==1.6.0", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
arena = "agent_arena.cli:main"

[tool.setuptools]
packages = ["agent_arena", "arena_server"]
package-dir = {agent_arena = "sdk/agent_arena", arena_server = "backend/arena_server"}

[tool.setuptools.package-data]
arena_server = ["task_library.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F401", "F821", "F841"]
ignore = ["E731"]

[tool.pyright]
extraPaths = ["sdk", "backend"]

